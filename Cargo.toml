# Standalone package — explicitly opts out of any enclosing workspace
# (the folder may sit inside an unrelated cargo workspace on disk).
[workspace]

[package]
name = "rusty-ssr"
version = "0.3.4"
edition = "2021"
authors = ["Egor Babushkin"]
description = "High-performance SSR engine for Rust with V8 isolate pool and multi-tier caching"
license = "MIT"
repository = "https://github.com/babasha/Rusty-SSR"
homepage = "https://github.com/babasha/Rusty-SSR"
documentation = "https://docs.rs/rusty-ssr"
readme = "README.md"
keywords = ["ssr", "v8", "preact", "react", "rendering"]
categories = ["web-programming", "caching", "asynchronous"]

[lib]
name = "rusty_ssr"
path = "src/lib.rs"

# Run an SSR bundle in the real engine and report what it does — the check every
# project otherwise writes by hand, against a hand-copied prelude that drifts.
[[bin]]
name = "rusty-ssr-check"
path = "src/bin/rusty-ssr-check.rs"
required-features = ["v8-pool"]

# Uses axum, which is no longer a default feature — see [features].
[[example]]
name = "basic"
path = "examples/basic.rs"
required-features = ["axum-integration"]

[[example]]
name = "loadtest"
path = "examples/loadtest.rs"

# Optimizations for production
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[features]
# The engine and its caches, and nothing else.
#
# `axum-integration` used to be on by default, which meant every consumer
# compiled axum + tower + tower-http whether or not they touched the one
# middleware behind that flag — and, worse, got a *second* axum in the
# dependency graph the moment their own axum version moved past ours. An SSR
# engine has no business pinning anyone's web framework. Opt in with
# `features = ["axum-integration"]` if you want the brotli middleware.
default = ["v8-pool", "cache"]
v8-pool = ["deno_core", "serde_v8"]
cache = ["dashmap", "parking_lot", "lru", "bytes"]
axum-integration = ["axum", "tower", "tower-http"]
brotli-compression = ["brotli", "tokio/fs"]
full = ["v8-pool", "cache", "axum-integration", "brotli-compression"]

[dependencies]
# Core async runtime (sync for oneshot, rt for yield_now, time for render timeout)
tokio = { version = "1", features = ["rt", "sync", "time"] }
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Tracing/logging
tracing = "0.1"

# System info
num_cpus = "1.16"

# Thread-local storage
thread_local = "1.1"

# V8 integration (optional)
deno_core = { version = "0.322", optional = true }
serde_v8 = { version = "0.231", optional = true }

# Concurrent cache (optional)
dashmap = { version = "6.1", optional = true }
parking_lot = { version = "0.12", optional = true }
lru = { version = "0.12", optional = true }

# Cheap-to-clone byte buffers. A page-cache hit hands back a refcount bump
# rather than a copy of the document, which is most of the point of caching a
# finished page instead of a fragment.
bytes = { version = "1", optional = true }

# CPU affinity for thread pinning
core_affinity = "0.8"

# Web framework integration (optional)
axum = { version = "0.7", optional = true }
tower = { version = "0.4", features = ["util"], optional = true }
tower-http = { version = "0.5", features = ["fs", "compression-br", "trace", "timeout"], optional = true }

# Brotli compression (optional)
brotli = { version = "7.0", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tracing-subscriber = "0.3"
criterion = { version = "0.5", features = ["async_tokio"] }
tempfile = "3.10"

[[bench]]
name = "ssr_benchmark"
harness = false

[[bench]]
name = "cache_benchmark"
harness = false

# The hot paths a request actually walks. Written as the evidence for the
# optimisations below it; see the bench's module docs for the before/after
# recipe.
[[bench]]
name = "hotpath_benchmark"
harness = false

# An HTTP server around the engine, for benchmarking it against other SSR
# stacks on equal terms. Needs axum, hence the feature.
[[example]]
name = "http_server"
path = "examples/http_server.rs"
required-features = ["axum-integration"]
